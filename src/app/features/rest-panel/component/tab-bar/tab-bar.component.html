<div
  class="flex min-w-0 max-w-full items-center overflow-x-auto border-b bg-muted/20"
>
  @for (tab of tabStore.tabs(); track tab.id; let i = $index) {
    <button
      class="box-border inline-flex h-11 min-w-[170px] max-w-[220px] flex-none items-center justify-between gap-2 border-t-2 border-transparent px-1 text-sm text-foreground/70 transition-colors hover:bg-muted/60 hover:text-foreground"
      [ngClass]="
        tabStore.activeTabIndex() === i
          ? 'border-t-primary bg-background text-foreground'
          : ''
      "
    >
      <div
        class="flex h-full min-w-0 flex-1 items-center justify-start pl-2"
        (click)="tabStore.setActiveTab(i)"
      >
        <span [ngClass]="methodColor(tab.method)" class="mr-2 text-xs">{{
          tab.method
        }}</span>

        @if (editingIndex === i) {
          <input
            hlmInput
            class="h-8"
            [value]="editingName"
            (input)="editingName = $any($event.target).value"
            (blur)="commitRename(i)"
            (keydown.enter)="commitRename(i)"
            (keydown.escape)="cancelRename()"
          />
        } @else {
          <span
            class="truncate text-left"
            title="Rename (F2)"
            (dblclick)="$event.stopPropagation(); startRename(i)"
          >
            {{ tab.name }}
          </span>
        }
      </div>

      <span
        class="flex h-full items-center justify-center gap-1 p-1 pr-1 text-foreground/60 hover:text-foreground"
      >
        @if (tabStore.tabs().length > 1) {
          <ng-icon
            class="cursor-pointer"
            (click)="$event.stopPropagation(); tabStore.deleteTab(i)"
            name="lucideX"
          ></ng-icon>
        }
      </span>
    </button>
  }
  <button
    hlmBtn
    variant="ghost"
    class="h-8 w-8 shrink-0 p-0"
    (click)="tabStore.addTab()"
    size="sm"
    aria-label="Create new request tab"
  >
    <ng-icon name="lucidePlus"></ng-icon>
  </button>
</div>
